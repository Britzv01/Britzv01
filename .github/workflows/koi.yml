name: Draw GitHub Koi

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every day at midnight UTC
  workflow_dispatch: # Gives you a button to run it manually

permissions:
  contents: write # Allows the bot to save the fish image to your repository

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate git-koi
        uses: yalongwastaken/git-koi@v1.0.2

      - name: Save the new fish
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add koi/
          git commit -m "Update GitHub Koi" || exit 0
          git push
